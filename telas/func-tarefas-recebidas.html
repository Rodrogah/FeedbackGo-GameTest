<div class="content-area">
    <div id="listaTarefasFuncionario"></div>
</div>

<!-- JANELA UNIFICADA DE TAREFA: RESPONDER / REENVIAR -->
<div id="modalResponderTarefa" class="modal-overlay hidden task-modal-overlay" style="z-index: 10000;">
    <div class="modal-content task-modal">
        <div class="task-modal__header">
            <div class="task-modal__head-icon" id="headIconResponder"><i class="fa-solid fa-reply"></i></div>
            <div class="task-modal__head-text">
                <h2 id="modalTarefaTitulo">Responder Tarefa</h2>
                <p class="task-modal__kicker" id="modalKickerTarefa"><strong id="modalTarefaRemetente">Administrador</strong> &mdash; conclua e envie sua entrega para revisão</p>
            </div>
            <button class="task-modal__close" onclick="fecharModalTarefa()">&times;</button>
        </div>

        <div class="task-modal__body">
            <div id="boxFeedbackAdmin" class="feedback-recall" style="display: none;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div>
                    <strong>O que precisa ser corrigido:</strong>
                    <p id="textoFeedbackAdmin"></p>
                    <div id="anexosFeedbackAdmin" style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;"></div>
                </div>
            </div>

            <p class="modal-section-title"><i class="fa-solid fa-file-lines"></i> Instruções da Tarefa</p>
            <div class="info-card">
                <p id="modalTarefaDescricao"></p>
            </div>

            <div id="modalTarefaAnexosAdmin"></div>

            <hr class="modal-divider">

            <p class="modal-section-title"><i class="fa-solid fa-paper-plane"></i> Sua Entrega</p>
            <form id="formEntregarTarefa">
                <input type="hidden" id="entregarTarefaId">

                <div class="form-group">
                    <label>Título Final para o Relatório</label>
                    <input type="text" id="entregarTitulo" class="form-control" required placeholder="Ex: Planilha Finalizada">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-arrow-up-9-1"></i> Quantidade Realizada (Opcional)</label>
                    <input type="number" id="entregarQuantidade" class="form-control" placeholder="Ex: 105 (Apenas números)">
                </div>

                <div class="form-group">
                    <label>Observações da Entrega (Opcional)</label>
                    <textarea id="entregarObservacoes" class="form-control" rows="3" placeholder="Descreva o que foi feito ou responda ao Admin..."></textarea>
                </div>

                <div class="form-group">
                    <label>Seus Arquivos de Resposta (Opcional - Máx: 3)</label>
                    <div class="file-drop-area">
                        <span class="fake-btn">Escolher arquivos</span>
                        <span class="file-msg">ou arraste e solte aqui</span>
                        <input type="file" id="entregarArquivos" multiple class="file-input">
                    </div>
                    <div id="entregarArquivosLista" style="margin-top: 10px;"></div>
                </div>
            </form>
        </div>

        <div class="task-modal__footer">
            <button type="button" class="btn btn-secondary btn-small" onclick="fecharModalTarefa()">Cancelar</button>
            <button type="submit" form="formEntregarTarefa" class="btn btn-primary btn-small"><i class="fa-solid fa-paper-plane"></i> Enviar para Revisão</button>
        </div>
    </div>
</div>
